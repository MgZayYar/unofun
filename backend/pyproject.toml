[project]
name = "unofun-backend"
version = "0.1.0"
description = "unofun API — AI video dubbing in 20+ languages"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "bcrypt>=4.2,<5.0",
  "edge-tts>=7.0,<8.0",
  "email-validator>=2.2,<3.0",
  "faster-whisper>=1.1,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "openai>=1.0,<3.0",
  "PyJWT>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "python-dotenv>=1.0,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
