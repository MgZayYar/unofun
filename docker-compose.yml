services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - unofun-data:/srv/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: ./backend
    command: python -m app.workers.runner
    env_file: .env
    volumes:
      - unofun-data:/srv/data
    depends_on:
      api:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  unofun-data:
